name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ledger (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ledger } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ledger }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  python:
    name: ML + backend (pytest, real Rust signer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ledger }
      - run: pip install -r ml/requirements.txt -r backend/requirements-dev.txt tabulate
      - name: Build ledger CLI used by backend integration tests
        run: cargo build -q -p ledger-signer --bin ledger-cli
        working-directory: ledger
      - name: ML tests
        run: python -m pytest --cov --cov-report=term --cov-fail-under=80
        working-directory: ml
      - name: Backend tests
        run: python -m pytest --cov --cov-report=term --cov-fail-under=80
        working-directory: backend
      - name: ML report smoke run
        run: python run_all.py --quick > /dev/null
        working-directory: ml

  app:
    name: App (typecheck, Jest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --coverage --ci

  infra:
    name: AWS CDK (synth assertions)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
