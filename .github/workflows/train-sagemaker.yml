name: Train demand model on SageMaker

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Configure AWS credentials (OIDC role)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: pip install "sagemaker<3" boto3
      - name: Launch spot training job and wait
        run: |
          out() { aws cloudformation describe-stacks --stack-name SmartRetailOS --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          python ml/sagemaker/launch.py --role "$(out SageMakerRoleArn)" --bucket "$(out ArtifactsBucket)" --wait
