name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", "spec/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub Release

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: app } }
    env:
      # Public cloud identifiers (not secrets). Set them as repository *variables*
      # after running "Deploy AWS"; empty values = offline/demo build.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      EXPO_PUBLIC_USER_POOL_ID: ${{ vars.USER_POOL_ID }}
      EXPO_PUBLIC_USER_POOL_CLIENT_ID: ${{ vars.USER_POOL_CLIENT_ID }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: node scripts/sync-spec.js
      - name: Unit tests must pass before building
        run: npx jest --ci
      - name: Generate native Android project (Continuous Native Generation)
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK
        working-directory: app/android
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DukaanAI-v1.0.${{ github.run_number }}.apk
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: DukaanAI-apk
          path: app/dist/*.apk
          retention-days: 30
      - name: Publish GitHub Release (easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Dukaan AI v1.0.${{ github.run_number }} (Android APK)
          body: |
            Install on Android: download the APK below, open it, and allow "Install unknown apps" when asked.
            Built from ${{ github.sha }}. Cloud: ${{ vars.API_URL != '' && 'connected to AWS' || 'offline demo build (set API_URL variables to connect)' }}.
          files: app/dist/*.apk
          make_latest: true
