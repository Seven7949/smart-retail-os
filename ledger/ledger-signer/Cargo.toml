[package]
name = "ledger-signer"
default-run = "ledger-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aws-config = "1.8.11"
aws-sdk-secretsmanager = "1.54.0"
lambda_runtime = "0.13.0"
ledger-core = { version = "0.1.0", path = "../ledger-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
